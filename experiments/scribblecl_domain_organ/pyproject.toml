[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribblecl-domain-organ"
version = "0.1.0"
description = "Replay-free sparse Domain/Organ continual segmentation experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["scribblecl_do*"]
